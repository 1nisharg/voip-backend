services:
  - type: web
    name: sania-token-server
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: hypercorn app:app --bind 0.0.0.0:$PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"

      - key: LIVEKIT_URL
        sync: false

      - key: LIVEKIT_API_KEY
        sync: false

      - key: LIVEKIT_API_SECRET
        sync: false

      - key: LIVEKIT_AGENT_NAME
        value: aarna-sania-laptop-test

      - key: LIVEKIT_TOKEN_TTL_MINUTES
        value: "30"

      - key: SANIA_AGENT_URL
        sync: false

      - key: SANIA_WAKE_TIMEOUT_SECONDS
        value: "90"
